name: Desktop Brewery - Build Images

on:
  push:
    branches: [ "main" ]
    paths:
      - '**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 18 * * 5' # Weekly build on Friday
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-cosmic
            context: fedora-cosmic
            image: fedora-cosmic
          - name: pop-os-cosmic
            context: pop-os-cosmic
            image: pop-os-cosmic
          - name: arch-kde
            context: arch-kde
            image: arch-kde
          - name: debian-sid-gnome
            context: debian-sid-gnome
            image: debian-sid-gnome
          - name: ubuntu-stable
            context: ubuntu-stable
            image: ubuntu-stable

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
